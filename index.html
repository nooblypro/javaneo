    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script>
        let allProblems = [];
        let problems = [];
        let currentIndex = -1;
        let currentProblem = null;
        let lastLoadedCode = "";

        // Status per problem ID: 'viewed' (yellow), 'passed' (green), 'failed' (red)
        let problemStatus = {};

        // Toast notifications helper
        function showToast(msg, type = "info") {
            const container = document.getElementById("toast-container");
            if (!container) return;
            const toast = document.createElement("div");
            toast.className = "toast" + (type === "error" ? " toast-error" : type === "success" ? " toast-success" : "");
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 250);
            }, 3000);
        }

        // Themed In-Page Modal Dialog helper
        let activeDialogResolve = null;
        let activeDialogCleanup = null;
        let previousActiveElement = null;

        function closeDialog(result = false) {
            if (activeDialogCleanup) {
                activeDialogCleanup(result);
            }
        }

        function showDialog({
            title = "",
            message = "",
            customElement = null,
            confirmText = "OK",
            cancelText = "Cancel",
            danger = false,
            alertOnly = false,
            cancelOnly = false,
            hideButtons = false
        } = {}) {
            // Only one dialog at a time: if one is already open, resolve it as false/cancelled first
            if (activeDialogResolve) {
                activeDialogResolve(false);
                activeDialogResolve = null;
            }

            return new Promise((resolve) => {
                previousActiveElement = document.activeElement;
                activeDialogResolve = resolve;

                const backdrop = document.getElementById("modal-backdrop");
                const dialog = document.getElementById("modal-dialog");
                const titleEl = document.getElementById("modal-title-text");
                const messageEl = document.getElementById("modal-message-text");
                const cancelBtn = document.getElementById("modal-cancel-btn");
                const confirmBtn = document.getElementById("modal-confirm-btn");

                titleEl.textContent = title;
                messageEl.textContent = message;
                if (customElement) {
                    messageEl.appendChild(customElement);
                }
                confirmBtn.textContent = confirmText;
                cancelBtn.textContent = cancelText;

                if (danger) {
                    confirmBtn.className = "modal-btn modal-btn-danger";
                } else {
                    confirmBtn.className = "modal-btn modal-btn-confirm";
                }

                if (cancelOnly) {
                    confirmBtn.style.display = "none";
                    cancelBtn.style.display = "";
                } else if (alertOnly) {
                    cancelBtn.style.display = "none";
                    confirmBtn.style.display = "";
                } else if (hideButtons) {
                    confirmBtn.style.display = "none";
                    cancelBtn.style.display = "none";
                } else {
                    cancelBtn.style.display = "";
                    confirmBtn.style.display = "";
                }

                backdrop.setAttribute("aria-hidden", "false");
                backdrop.classList.add("open");

                function cleanup(result) {
                    window.removeEventListener("keydown", onKeyDown, true);
                    backdrop.removeEventListener("click", onBackdropClick);
                    cancelBtn.removeEventListener("click", onCancel);
                    confirmBtn.removeEventListener("click", onConfirm);

                    backdrop.classList.remove("open");
                    backdrop.setAttribute("aria-hidden", "true");

                    activeDialogResolve = null;
                    activeDialogCleanup = null;
                    if (previousActiveElement && typeof previousActiveElement.focus === "function") {
                        previousActiveElement.focus();
                    }
                    resolve(result);
                }

                activeDialogCleanup = cleanup;

                function onConfirm(e) {
                    if (e) e.stopPropagation();
                    cleanup(true);
                }

                function onCancel(e) {
                    if (e) e.stopPropagation();
                    cleanup(alertOnly ? true : false);
                }

                function onBackdropClick(e) {
                    if (e.target === backdrop) {
                        cleanup(alertOnly ? true : false);
                    }
                }

                function onKeyDown(e) {
                    if (e.key === "Escape") {
                        e.preventDefault();
                        e.stopPropagation();
                        cleanup(alertOnly ? true : false);
                        return;
                    }
                    if (e.key === "Enter") {
                        // Allow enter unless user is explicitly on cancel button
                        if (document.activeElement !== cancelBtn) {
                            e.preventDefault();
                            e.stopPropagation();
                            cleanup(true);
                            return;
                        }
                    }
                    if (e.key === "Tab") {
                        // Trap focus inside modal
                        const focusables = alertOnly ? [confirmBtn] : [cancelBtn, confirmBtn];
                        const first = focusables[0];
                        const last = focusables[focusables.length - 1];
                        if (e.shiftKey) {
                            if (document.activeElement === first) {
                                e.preventDefault();
                                last.focus();
                            }
                        } else {
                            if (document.activeElement === last) {
                                e.preventDefault();
                                first.focus();
                            }
                        }
                    }
                }

                confirmBtn.addEventListener("click", onConfirm);
                cancelBtn.addEventListener("click", onCancel);
                backdrop.addEventListener("click", onBackdropClick);
                window.addEventListener("keydown", onKeyDown, true);

                // Focus the primary button when opened
                requestAnimationFrame(() => {
                    confirmBtn.focus();
                });
            });
        }

        // Generic API helper
        async function api(path, method = "GET", body) {
            const res = await fetch(path, {
                method,
                headers: { "Content-Type": "application/json" },
                body: body ? JSON.stringify(body) : undefined,
            });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.error || "Request failed");
            }
            return data;
        }

        // Synchronize editor line numbers and syntax highlighting
        const editor = document.getElementById("code-editor");
        const lineNumbers = document.getElementById("line-numbers");
        const editorPre = document.getElementById("editor-pre");
        const editorCode = document.getElementById("editor-highlight-code");

        const KEYWORDS = new Set([
            "abstract", "assert", "boolean", "break", "byte", "case", "catch", "char", "class", "const",
            "continue", "default", "do", "double", "else", "enum", "extends", "final", "finally", "float",
            "for", "goto", "if", "implements", "import", "instanceof", "int", "interface", "long", "native",
            "new", "package", "private", "protected", "public", "return", "short", "static", "strictfp", "super",
            "switch", "synchronized", "this", "throw", "throws", "transient", "try", "void", "volatile", "while",
            "var", "record", "yield", "true", "false", "null"
        ]);

        const KNOWN_TYPES = new Set([
            "String", "Integer", "Double", "Float", "Long", "Short", "Byte", "Character", "Boolean",
            "Object", "Math", "System", "Scanner", "ArrayList", "List", "Map", "HashMap", "HashSet",
            "Set", "LinkedHashMap", "LinkedList", "Queue", "Deque", "Stack", "Iterator", "Collections",
            "Arrays", "Optional", "StringBuilder", "Exception", "RuntimeException", "IllegalArgumentException",
            "NumberFormatException", "ArithmeticException", "InputMismatchException", "Thread", "Runnable",
            "BufferedReader", "FileReader", "FileWriter", "PrintWriter", "File", "FileInputStream",
            "FileOutputStream", "ObjectInputStream", "ObjectOutputStream", "Serializable"
        ]);

        function highlightJava(src) {
            // Escape &, <, > before tokenising
            const escaped = src
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Highlighter rules in order (earlier wins):
            // 1. Comments: /* ... */ or // ...
            // 2. Strings & chars: "..." (with \" escapes) and '...'
            // 3. Numbers: hex (0x...), decimals/integers with L/f/d suffix
            // 4. Annotations: @Override etc.
            // 5. Protected HTML entities from step 1
            // 6. Identifiers (keywords, types, or plain)
            const TOKEN_REGEX = /(\/\*[\s\S]*?\*\/|\/\/[^\r\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b0[xX][0-9a-fA-F]+[lL]?\b|\b\d+(?:\.\d+)?(?:[fFdDlL])?\b|(?:\b|\B)\.\d+(?:[fFdDlL])?\b)|(@[a-zA-Z_]\w*)|(&(?:amp|lt|gt);)|([a-zA-Z_$][a-zA-Z0-9_$]*)/g;

            return escaped.replace(TOKEN_REGEX, (match, comment, string, number, annotation, entity, word) => {
                if (comment) return `<span class="tok-comment">${comment}</span>`;
                if (string) return `<span class="tok-string">${string}</span>`;
                if (number) return `<span class="tok-number">${number}</span>`;
                if (annotation) return `<span class="tok-keyword">${annotation}</span>`;
                if (entity) return entity;
                if (word) {
                    if (KEYWORDS.has(word)) {
                        return `<span class="tok-keyword">${word}</span>`;
                    }
                    if (KNOWN_TYPES.has(word) || /^[A-Z][a-z]/.test(word) || /^[A-Z][a-zA-Z0-9_]*$/.test(word)) {
                        return `<span class="tok-type">${word}</span>`;
                    }
                    return word;
                }
                return match;
            });
        }

        function updateHighlight() {
            const val = editor.value || "";
            editorCode.innerHTML = highlightJava(val) + (val.endsWith("\n") ? "\n" : "");
        }

        function updateLineNumbers() {
            const lines = (editor.value || "").split("\n").length;
            let str = "";
            for (let i = 1; i <= lines; i++) {
                str += i + "\n";
            }
            lineNumbers.textContent = str;
        }

        function updateEditor() {
            updateLineNumbers();
            updateHighlight();
        }

        editor.addEventListener("input", updateEditor);
        editor.addEventListener("scroll", () => {
            lineNumbers.scrollTop = editor.scrollTop;
            editorPre.scrollTop = editor.scrollTop;
            editorPre.scrollLeft = editor.scrollLeft;
        });

        function replaceRange(rangeStart, rangeEnd, text, targetStart, targetEnd) {
            editor.focus();
            editor.setSelectionRange(rangeStart, rangeEnd);
            let ok = false;
            try {
                if (text === "") {
                    ok = document.execCommand("delete");
                } else {
                    ok = document.execCommand("insertText", false, text);
                }
            } catch (err) {
                ok = false;
            }
            if (!ok) {
                const val = editor.value;
                editor.value = val.substring(0, rangeStart) + text + val.substring(rangeEnd);
            }
            const selStart = (targetStart !== undefined && targetStart !== null)
                ? targetStart
                : rangeStart + text.length;
            const selEnd = (targetEnd !== undefined && targetEnd !== null)
                ? targetEnd
                : selStart;
            editor.setSelectionRange(selStart, selEnd);
            editor.dispatchEvent(new Event("input", { bubbles: true }));
        }

        function getMatchingIndent(text, pos) {
            const stack = [];
            let i = 0;
            let inString = false;
            let inChar = false;
            let inLineComment = false;
            let inBlockComment = false;
            let currentLineIndent = "";
            let lineStart = true;

            while (i < pos) {
                const c = text[i];
                const next = i + 1 < pos ? text[i + 1] : "";

                if (inLineComment) {
                    if (c === "\n") {
                        inLineComment = false;
                        lineStart = true;
                        currentLineIndent = "";
                    }
                    i++;
                    continue;
                }
                if (inBlockComment) {
                    if (c === "*" && next === "/") {
                        inBlockComment = false;
                        i += 2;
                        continue;
                    }
                    if (c === "\n") {
                        lineStart = true;
                        currentLineIndent = "";
                    }
                    i++;
                    continue;
                }
                if (inString) {
                    if (c === "\\") {
                        i += 2;
                        continue;
                    }
                    if (c === '"') {
                        inString = false;
                    }
                    i++;
                    continue;
                }
                if (inChar) {
                    if (c === "\\") {
                        i += 2;
                        continue;
                    }
                    if (c === "'") {
                        inChar = false;
                    }
                    i++;
                    continue;
                }

                if (c === "/" && next === "/") {
                    inLineComment = true;
                    i += 2;
                    continue;
                }
                if (c === "/" && next === "*") {
                    inBlockComment = true;
                    i += 2;
                    continue;
                }
                if (c === '"') {
                    inString = true;
                    lineStart = false;
                    i++;
                    continue;
                }
                if (c === "'") {
                    inChar = true;
                    lineStart = false;
                    i++;
                    continue;
                }

                if (c === "\n") {
                    lineStart = true;
                    currentLineIndent = "";
                    i++;
                    continue;
                }

                if (lineStart) {
                    if (c === " " || c === "\t") {
                        currentLineIndent += c;
                        i++;
                        continue;
                    } else {
                        lineStart = false;
                    }
                }

                if (c === "{") {
                    stack.push(currentLineIndent);
                } else if (c === "}") {
                    if (stack.length > 0) {
                        stack.pop();
                    }
                }
                i++;
            }

            return stack.length > 0 ? stack[stack.length - 1] : null;
        }

        // Editor keyboard shortcuts: smart indentation, auto-closing brackets, Tab support & Ctrl/Cmd+Enter run
        editor.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                e.preventDefault();
                compileAndRun();
                return;
            }

            if (e.key === "Enter" && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey) {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const val = editor.value;

                const lastNewline = val.lastIndexOf("\n", start - 1);
                const lineBeforeCaret = val.substring(lastNewline + 1, start);
                const indentMatch = lineBeforeCaret.match(/^[ \t]*/);
                let indent = indentMatch ? indentMatch[0] : "";

                const charBefore = start > 0 ? val[start - 1] : "";
                const charAfter = end < val.length ? val[end] : "";

                if (charBefore === "{" && charAfter === "}") {
                    const toInsert = "\n" + indent + "    \n" + indent;
                    const caretTarget = start + 1 + indent.length + 4;
                    replaceRange(start, end, toInsert, caretTarget);
                } else {
                    if (charBefore === "{") {
                        indent += "    ";
                    }
                    const toInsert = "\n" + indent;
                    replaceRange(start, end, toInsert, start + toInsert.length);
                }
                return;
            }

            if (e.key === "{" && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const val = editor.value;
                if (start !== end) {
                    e.preventDefault();
                    const sel = val.substring(start, end);
                    replaceRange(start, end, "{" + sel + "}", start + 1, start + 1 + sel.length);
                } else {
                    const nextChar = start < val.length ? val[start] : "";
                    if (/[a-zA-Z0-9]/.test(nextChar)) {
                        e.preventDefault();
                        replaceRange(start, end, "{", start + 1);
                    } else {
                        e.preventDefault();
                        replaceRange(start, end, "{}", start + 1);
                    }
                }
                return;
            }

            if (e.key === "}" && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const val = editor.value;

                if (start === end && start < val.length && val[start] === "}") {
                    e.preventDefault();
                    editor.setSelectionRange(start + 1, start + 1);
                    return;
                }

                if (start === end) {
                    const lastNewline = val.lastIndexOf("\n", start - 1);
                    const lineBeforeCaret = val.substring(lastNewline + 1, start);
                    if (/^[ \t]*$/.test(lineBeforeCaret)) {
                        const matchingIndent = getMatchingIndent(val, lastNewline + 1);
                        if (matchingIndent !== null) {
                            e.preventDefault();
                            const newText = matchingIndent + "}";
                            replaceRange(lastNewline + 1, start, newText, lastNewline + 1 + newText.length);
                            return;
                        }
                    }
                }

                e.preventDefault();
                replaceRange(start, end, "}", start + 1);
                return;
            }

            if (e.key === "(" && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const val = editor.value;
                if (start !== end) {
                    e.preventDefault();
                    const sel = val.substring(start, end);
                    replaceRange(start, end, "(" + sel + ")", start + 1, start + 1 + sel.length);
                } else {
                    const nextChar = start < val.length ? val[start] : "";
                    if (/[a-zA-Z0-9]/.test(nextChar)) {
                        e.preventDefault();
                        replaceRange(start, end, "(", start + 1);
                    } else {
                        e.preventDefault();
                        replaceRange(start, end, "()", start + 1);
                    }
                }
                return;
            }

            if (e.key === ")" && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const val = editor.value;
                if (start === end && start < val.length && val[start] === ")") {
                    e.preventDefault();
                    editor.setSelectionRange(start + 1, start + 1);
                } else {
                    e.preventDefault();
                    replaceRange(start, end, ")", start + 1);
                }
                return;
            }

            if (e.key === '"' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const val = editor.value;
                if (start === end && start < val.length && val[start] === '"') {
                    e.preventDefault();
                    editor.setSelectionRange(start + 1, start + 1);
                } else {
                    e.preventDefault();
                    replaceRange(start, end, '"', start + 1);
                }
                return;
            }

            if (e.key === "Tab") {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const val = editor.value;

                if (start !== end && val.substring(start, end).includes("\n")) {
                    const blockStart = val.lastIndexOf("\n", start - 1) + 1;
                    let blockEnd = val.indexOf("\n", end);
                    if (blockEnd === -1) blockEnd = val.length;
                    const blockText = val.substring(blockStart, blockEnd);
                    const lines = blockText.split("\n");

                    if (e.shiftKey) {
                        let removedFirst = 0;
                        let totalRemoved = 0;
                        const newLines = lines.map((line, idx) => {
                            let sp = 0;
                            while (sp < 4 && line[sp] === " ") sp++;
                            if (sp === 0 && line[0] === "\t") sp = 1;
                            if (idx === 0) removedFirst = sp;
                            totalRemoved += sp;
                            return line.substring(sp);
                        });
                        const replacement = newLines.join("\n");
                        replaceRange(blockStart, blockEnd, replacement,
                            Math.max(blockStart, start - removedFirst),
                            Math.max(blockStart, end - totalRemoved)
                        );
                    } else {
                        const newLines = lines.map(line => "    " + line);
                        const replacement = newLines.join("\n");
                        replaceRange(blockStart, blockEnd, replacement,
                            start + 4,
                            end + (lines.length * 4)
                        );
                    }
                } else if (e.shiftKey) {
                    const lineStart = val.lastIndexOf("\n", start - 1) + 1;
                    let count = 0;
                    while (count < 4 && val[lineStart + count] === " ") {
                        count++;
                    }
                    if (count === 0 && val[lineStart] === "\t") {
                        count = 1;
                    }
                    if (count > 0) {
                        const newStart = Math.max(lineStart, start - count);
                        const newEnd = Math.max(lineStart, end - count);
                        replaceRange(lineStart, lineStart + count, "", newStart, newEnd);
                    }
                } else {
                    replaceRange(start, end, "    ", start + 4);
                }
                return;
            }
        });

        // LocalStorage bookmark management: key "javaneo.bookmarks"
        function getBookmarks() {
            try {
                const raw = localStorage.getItem("javaneo.bookmarks");
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function saveBookmarks(bmarks) {
            try {
                localStorage.setItem("javaneo.bookmarks", JSON.stringify(bmarks));
            } catch (e) {
                // Ignore storage errors if disabled/blocked
            }
        }

        function isBookmarked(pid) {
            return getBookmarks().includes(pid);
        }

        function toggleBookmark() {
            if (!currentProblem) return;
            const pid = currentProblem.id;
            let bmarks = getBookmarks();
            if (bmarks.includes(pid)) {
                bmarks = bmarks.filter(id => id !== pid);
            } else {
                bmarks.push(pid);
            }
            saveBookmarks(bmarks);
            updateBookmarkUI();
            renderTabStrip();
        }

        function updateBookmarkUI() {
            const icon = document.getElementById("bookmark-btn");
            if (!icon) return;
            if (currentProblem && isBookmarked(currentProblem.id)) {
                icon.classList.add("bookmarked");
            } else {
                icon.classList.remove("bookmarked");
            }
        }

        // Sort Topic State & Labels
        let currentSortTopic = "all";
        try {
            const saved = localStorage.getItem("javaneo.sortTopic");
            if (saved) {
                currentSortTopic = saved;
            }
        } catch (e) { }

        const TOPIC_LABELS = {
            "file-io": "File I/O",
            "math-basics": "Math Basics",
            "stringbuilder": "StringBuilder",
            "arraylist": "ArrayList",
            "hashmap": "HashMap",
            "arrays": "Arrays",
            "exceptions": "Exceptions",
            "generics": "Generics",
            "inheritance": "Inheritance",
            "interfaces": "Interfaces",
            "oop": "OOP",
            "other": "Other",
            "serialization": "Serialization",
            "threads": "Threads"
        };

        function formatTopic(topic) {
            if (!topic) return "Other";
            if (TOPIC_LABELS[topic]) return TOPIC_LABELS[topic];
            return topic.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
        }

        function getFilteredProblems() {
            if (!currentSortTopic || currentSortTopic === "all") {
                return allProblems;
            }
            return allProblems.filter(p => p.topic === currentSortTopic);
        }

        function updateSortLabel() {
            const labelEl = document.getElementById("sort-topic-label");
            if (!labelEl) return;
            if (currentSortTopic && currentSortTopic !== "all") {
                labelEl.textContent = "Sort: " + formatTopic(currentSortTopic) + " (" + problems.length + ")";
            } else {
                labelEl.textContent = "";
            }
        }

        function applySortTopic(topic) {
            currentSortTopic = topic || "all";
            try {
                localStorage.setItem("javaneo.sortTopic", currentSortTopic);
            } catch (e) { }

            problems = getFilteredProblems();
            updateSortLabel();

            const openIdx = currentProblem ? problems.findIndex(p => p.id === currentProblem.id) : -1;
            if (openIdx !== -1) {
                currentIndex = openIdx;
                renderTabStrip();
            } else if (problems.length > 0) {
                selectProblem(0);
            } else {
                currentProblem = null;
                currentIndex = -1;
                renderTabStrip();
                document.getElementById("problem-title").textContent = "No problems in this topic";
                document.getElementById("problem-topic").textContent = formatTopic(currentSortTopic);
                document.getElementById("problem-statement").textContent = "No problems in this topic";
                document.getElementById("sample-cases-list").innerHTML = "";
                editor.value = "";
                lastLoadedCode = "";
                updateEditor();
                renderFooter(null);
                updateBookmarkUI();
            }
        }

        async function openSortModal() {
            const counts = {};
            allProblems.forEach(p => {
                const t = p.topic || "other";
                counts[t] = (counts[t] || 0) + 1;
            });

            const list = document.createElement("div");
            list.className = "sort-topic-list";

            const allBtn = document.createElement("button");
            allBtn.type = "button";
            allBtn.className = "sort-topic-option" + (currentSortTopic === "all" || !currentSortTopic ? " active" : "");
            const allName = document.createElement("span");
            allName.textContent = "All topics";
            const allCount = document.createElement("span");
            allCount.className = "sort-topic-count";
            allCount.textContent = String(allProblems.length);
            allBtn.appendChild(allName);
            allBtn.appendChild(allCount);
            allBtn.onclick = () => {
                applySortTopic("all");
                closeDialog();
            };
            list.appendChild(allBtn);

            const sortedTopics = Object.keys(counts).sort((a, b) => {
                const nameA = formatTopic(a);
                const nameB = formatTopic(b);
                return nameA.localeCompare(nameB);
            });

            sortedTopics.forEach(t => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "sort-topic-option" + (currentSortTopic === t ? " active" : "");
                const name = document.createElement("span");
                name.textContent = formatTopic(t);
                const count = document.createElement("span");
                count.className = "sort-topic-count";
                count.textContent = String(counts[t]);
                btn.appendChild(name);
                btn.appendChild(count);
                btn.onclick = () => {
                    applySortTopic(t);
                    closeDialog();
                };
                list.appendChild(btn);
            });

            await showDialog({
                title: "Sort by Topic",
                customElement: list,
                cancelText: "Cancel",
                cancelOnly: true
            });
        }

        // Load problem list from server
        async function loadProblems() {
            try {
                allProblems = await api("/api/problems");
                problems = getFilteredProblems();
                updateSortLabel();
                renderTabStrip();
                if (problems.length > 0 && currentIndex === -1) {
                    selectProblem(0);
                }
            } catch (err) {
                showToast("Failed to load problems: " + err.message, "error");
            }
        }

        // Render top numbered tabs with status colors and bookmark outlines
        function renderTabStrip() {
            const strip = document.getElementById("tab-strip");
            strip.innerHTML = "";
            const bookmarks = getBookmarks();
            problems.forEach((p, idx) => {
                const square = document.createElement("div");
                const status = problemStatus[p.id];

                let statusClass = "";
                if (status === "passed") statusClass = " status-passed";
                else if (status === "failed") statusClass = " status-failed";
                else if (status === "viewed") statusClass = " status-viewed";

                const isBmk = bookmarks.includes(p.id);
                const bmkClass = isBmk ? " bookmarked" : "";
                const activeClass = idx === currentIndex ? " active" : "";

                square.className = "tab-square" + statusClass + activeClass + bmkClass;
                square.textContent = String(idx + 1);
                square.title = (idx + 1) + ". " + (p.title || p.id);
                square.onclick = () => selectProblem(idx);
                strip.appendChild(square);
            });
        }

        // Select and load a problem
        async function selectProblem(idx) {
            if (idx < 0 || idx >= problems.length) return;

            // Warn if unsaved changes exist
            if (currentProblem && editor.value !== lastLoadedCode) {
                const discard = await showDialog({
                    title: "Unsaved Changes",
                    message: "You have unsaved changes in your code. Discard them?",
                    confirmText: "Discard",
                    cancelText: "Keep Editing",
                    danger: true
                });
                if (!discard) return;
            }

            currentIndex = idx;
            const p = problems[idx];

            // If problem has not yet been marked passed or failed, mark as viewed (yellow)
            if (!problemStatus[p.id]) {
                problemStatus[p.id] = "viewed";
            }
            renderTabStrip();
            updateBookmarkUI();

            try {
                const data = await api("/api/problems/" + p.id);
                currentProblem = data;
                currentProblem.id = p.id;
                updateBookmarkUI();

                // Problem Statement Header & Topic
                document.getElementById("problem-title").textContent = data.title || p.id;
                document.getElementById("problem-topic").textContent = formatTopic(data.topic);
                document.getElementById("problem-statement").textContent = data.statement || "";

                // Render 2 Sample Test Cases under statement
                renderSampleCases(data.cases || []);

                // Update editor
                editor.value = data.code || "";
                lastLoadedCode = data.code || "";
                updateEditor();

                // Update fixed footer block
                renderFooter(data.footer);

                // Clear execution results for newly opened problem
                const resultsBody = document.getElementById("results-body");
                resultsBody.innerHTML = "";
                const placeholder = document.createElement("div");
                placeholder.className = "placeholder-text";
                placeholder.textContent = "Run or Submit code to see execution results.";
                resultsBody.appendChild(placeholder);
                document.getElementById("results-meta").textContent = "";

            } catch (err) {
                showToast("Failed to load problem: " + err.message, "error");
            }
        }

        function renderFooter(footerCode) {
            const container = document.getElementById("footer-container");
            const headingEl = document.getElementById("footer-heading-text");
            const codeEl = document.getElementById("footer-code");
            if (!container || !codeEl) return;

            if (footerCode && typeof footerCode === "string" && footerCode.trim().length > 0) {
                if (headingEl) {
                    headingEl.textContent = "Footer";
                }
                codeEl.innerHTML = highlightJava(footerCode);
                container.style.display = "flex";
            } else {
                codeEl.innerHTML = "";
                container.style.display = "none";
            }
        }

        // Render 2 sample cases under problem statement in the same format as execution output
        function renderSampleCases(cases) {
            const listEl = document.getElementById("sample-cases-list");
            listEl.innerHTML = "";

            const sampleSubset = cases.slice(0, 2);
            if (sampleSubset.length === 0) {
                const emptyMsg = document.createElement("div");
                emptyMsg.className = "placeholder-text";
                emptyMsg.style.color = "#6b7280";
                emptyMsg.textContent = "No sample cases provided.";
                listEl.appendChild(emptyMsg);
                return;
            }

            sampleSubset.forEach((c, idx) => {
                const card = document.createElement("div");
                card.className = "sample-card";

                const header = document.createElement("div");
                header.className = "sample-card-header";
                header.textContent = `Sample Case ${idx + 1}`;
                card.appendChild(header);

                const grid = document.createElement("div");
                grid.className = "case-io-grid";

                // Input box
                const inBox = document.createElement("div");
                inBox.className = "io-box";
                const inLabel = document.createElement("div");
                inLabel.className = "io-label";
                inLabel.textContent = "INPUT";
                const inContent = document.createElement("div");
                inContent.className = "io-content";
                inContent.textContent = c.input !== undefined ? c.input : "";
                inBox.appendChild(inLabel);
                inBox.appendChild(inContent);

                // Expected Output box
                const expBox = document.createElement("div");
                expBox.className = "io-box";
                const expLabel = document.createElement("div");
                expLabel.className = "io-label";
                expLabel.textContent = "EXPECTED OUTPUT";
                const expContent = document.createElement("div");
                expContent.className = "io-content";
                expContent.textContent = c.expected !== undefined ? c.expected : "";
                expBox.appendChild(expLabel);
                expBox.appendChild(expContent);

                grid.appendChild(inBox);
                grid.appendChild(expBox);
                card.appendChild(grid);
                listEl.appendChild(card);
            });
        }

        // Clear button
        async function clearCode() {
            if (!currentProblem) return;
            const ok = await showDialog({
                title: "Clear Editor",
                message: "Clear editor contents?",
                confirmText: "Clear",
                cancelText: "Cancel",
                danger: true
            });
            if (ok) {
                editor.value = "";
                updateEditor();
            }
        }

        // Next button
        function nextProblem() {
            if (currentIndex + 1 < problems.length) {
                selectProblem(currentIndex + 1);
            } else {
                showToast("You are on the last problem.", "info");
            }
        }

        // Save current code
        async function saveCurrentCode() {
            if (!currentProblem) return;
            await api("/api/problems/" + currentProblem.id + "/code", "PUT", {
                code: editor.value
            });
            lastLoadedCode = editor.value;
        }

        // Compile and Run
        async function compileAndRun() {
            if (!currentProblem) {
                showToast("No problem selected.", "error");
                return;
            }

            const btn = document.getElementById("btn-run");
            btn.disabled = true;
            btn.textContent = "Running...";

            const resultsBody = document.getElementById("results-body");
            resultsBody.innerHTML = "";
            const runningIndicator = document.createElement("div");
            runningIndicator.className = "placeholder-text";
            runningIndicator.textContent = "Compiling and running test cases...";
            resultsBody.appendChild(runningIndicator);

            try {
                // Auto-save before running
                await saveCurrentCode();

                const res = await api("/api/problems/" + currentProblem.id + "/run", "POST", {});

                // Determine problem pass/fail status
                if (res.compile_error) {
                    problemStatus[currentProblem.id] = "failed";
                } else {
                    const cases = res.results || [];
                    const allPass = cases.length > 0 && cases.every(c => c.status === "pass");
                    problemStatus[currentProblem.id] = allPass ? "passed" : "failed";
                }
                renderTabStrip();

                renderResults(res);
            } catch (err) {
                problemStatus[currentProblem.id] = "failed";
                renderTabStrip();

                resultsBody.innerHTML = "";
                const errCard = document.createElement("div");
                errCard.className = "compile-card compile-card-error";

                const errHead = document.createElement("div");
                errHead.className = "compile-card-header";
                errHead.appendChild(createStatusIcon("error"));

                const errTitle = document.createElement("div");
                errTitle.className = "compile-card-title";
                errTitle.textContent = "Execution Failed";
                errHead.appendChild(errTitle);
                errCard.appendChild(errHead);

                const outBlock = document.createElement("div");
                outBlock.className = "compile-error-output";
                outBlock.textContent = err.message;
                errCard.appendChild(outBlock);

                resultsBody.appendChild(errCard);
                showToast("Execution error: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Compile & Run";
            }
        }

        // SVG Helpers for Results
        function createStatusIcon(type) {
            const el = document.createElement("div");
            el.className = "status-icon " + (type === "pass" ? "status-icon-success" : type === "timeout" ? "status-icon-amber" : "status-icon-error");
            if (type === "pass") {
                el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            } else if (type === "timeout") {
                el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';
            } else {
                el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            }
            return el;
        }

        function createChevron() {
            const span = document.createElement("span");
            span.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
            return span.firstElementChild;
        }

        function createIoBox(titleText, contentText) {
            const box = document.createElement("div");
            box.className = "io-box";

            // Header with label and copy icon
            const header = document.createElement("div");
            header.className = "io-box-header";

            const title = document.createElement("span");
            title.className = "io-box-title";
            title.textContent = titleText;
            header.appendChild(title);

            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "btn-copy-io";
            copyBtn.title = "Copy";
            copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';

            const textToCopy = contentText !== undefined && contentText !== null ? String(contentText) : "";
            copyBtn.onclick = async (e) => {
                e.stopPropagation();
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    showToast("Copied", "success");
                } catch (err) {
                    showToast("Failed to copy", "error");
                }
            };
            header.appendChild(copyBtn);
            box.appendChild(header);

            // Body with line numbers and text
            const body = document.createElement("div");
            body.className = "io-box-body";

            let lines = textToCopy.split("\n");
            if (lines.length > 1 && lines[lines.length - 1] === "") {
                lines.pop();
            }
            const lineCount = lines.length > 0 ? lines.length : 1;
            let gutterStr = "";
            for (let i = 1; i <= lineCount; i++) {
                gutterStr += i + (i < lineCount ? "\n" : "");
            }

            const gutter = document.createElement("div");
            gutter.className = "io-line-numbers";
            gutter.textContent = gutterStr;
            body.appendChild(gutter);

            const pre = document.createElement("pre");
            pre.className = "io-text";
            pre.textContent = textToCopy;
            body.appendChild(pre);

            box.appendChild(body);
            return box;
        }

        // Render test results matching reference design
        function renderResults(res) {
            const resultsBody = document.getElementById("results-body");
            resultsBody.innerHTML = "";
            document.getElementById("results-meta").textContent = "";

            // 1. Compile Error
            if (res.compile_error) {
                const card = document.createElement("div");
                card.className = "compile-card compile-card-error";

                const header = document.createElement("div");
                header.className = "compile-card-header";
                header.appendChild(createStatusIcon("error"));

                const title = document.createElement("div");
                title.className = "compile-card-title";
                title.textContent = "Compilation Failed";
                header.appendChild(title);
                card.appendChild(header);

                const outBlock = document.createElement("div");
                outBlock.className = "compile-error-output";
                outBlock.textContent = res.compile_error;
                card.appendChild(outBlock);

                resultsBody.appendChild(card);
                return;
            }

            // 2. Compile Success Card
            const compSuccess = document.createElement("div");
            compSuccess.className = "compile-card compile-card-success";
            compSuccess.appendChild(createStatusIcon("pass"));

            const compText = document.createElement("div");
            const compTitle = document.createElement("div");
            compTitle.className = "compile-card-title";
            compTitle.textContent = "Compiled successfully";
            const compSub = document.createElement("div");
            compSub.className = "compile-card-subtitle";
            compSub.textContent = "No compilation errors found.";
            compText.appendChild(compTitle);
            compText.appendChild(compSub);
            compSuccess.appendChild(compText);
            resultsBody.appendChild(compSuccess);

            const cases = res.results || [];
            let passedCount = 0;
            cases.forEach(c => {
                if (c.status === "pass") passedCount++;
            });
            const allPass = passedCount === cases.length && cases.length > 0;

            // 3. Summary Card
            const summaryCard = document.createElement("div");
            summaryCard.className = "summary-card " + (allPass ? "summary-card-success" : "summary-card-error");

            const sumLeft = document.createElement("div");
            sumLeft.style.display = "flex";
            sumLeft.style.alignItems = "center";
            sumLeft.style.gap = "12px";
            sumLeft.style.flex = "1";

            sumLeft.appendChild(createStatusIcon(allPass ? "pass" : "error"));

            const sumText = document.createElement("div");
            const sumTitle = document.createElement("div");
            sumTitle.className = "summary-card-title";
            sumTitle.textContent = `${passedCount}/${cases.length} Sample testcases passed`;
            const sumSub = document.createElement("div");
            sumSub.className = "summary-card-subtitle";
            sumSub.textContent = allPass ? "All sample testcases passed successfully." : "Some sample testcases failed.";
            sumText.appendChild(sumTitle);
            sumText.appendChild(sumSub);
            sumLeft.appendChild(sumText);
            summaryCard.appendChild(sumLeft);

            const sumChevron = document.createElement("div");
            sumChevron.className = "summary-chevron";
            sumChevron.appendChild(createChevron());
            summaryCard.appendChild(sumChevron);

            resultsBody.appendChild(summaryCard);

            // Container for all testcase cards
            const listContainer = document.createElement("div");
            listContainer.id = "testcase-list";

            summaryCard.onclick = () => {
                const isCollapsed = listContainer.classList.toggle("collapsed");
                sumChevron.classList.toggle("collapsed", isCollapsed);
            };

            // 4. Testcase Cards
            cases.forEach((c, idx) => {
                const card = document.createElement("div");
                card.className = "testcase-card";

                const isPass = c.status === "pass";
                const isRuntimeErr = c.status === "runtime_error";
                const isTimeout = c.status === "timeout";

                let statusType = "fail";
                let statusLabel = "Failed";
                let titleClass = "title-fail";

                if (isPass) {
                    statusType = "pass";
                    statusLabel = "Passed";
                    titleClass = "title-pass";
                } else if (isRuntimeErr) {
                    statusType = "error";
                    statusLabel = "Runtime Error";
                    titleClass = "title-fail";
                } else if (isTimeout) {
                    statusType = "timeout";
                    statusLabel = "Time Limit Exceeded";
                    titleClass = "title-timeout";
                }

                // Header
                const header = document.createElement("div");
                header.className = "testcase-card-header";

                const headerLeft = document.createElement("div");
                headerLeft.className = "testcase-card-header-left";
                headerLeft.appendChild(createStatusIcon(statusType));

                const title = document.createElement("div");
                title.className = "testcase-card-title " + titleClass;
                title.textContent = `Testcase ${idx + 1} - ${statusLabel}`;
                headerLeft.appendChild(title);
                header.appendChild(headerLeft);

                const chevron = document.createElement("div");
                chevron.className = "testcase-chevron";
                chevron.appendChild(createChevron());
                header.appendChild(chevron);

                card.appendChild(header);

                // Body (two boxes side by side)
                const body = document.createElement("div");
                body.className = "testcase-card-body";

                header.onclick = () => {
                    const isBodyCollapsed = body.classList.toggle("collapsed");
                    header.classList.toggle("collapsed", isBodyCollapsed);
                    chevron.classList.toggle("collapsed", isBodyCollapsed);
                };

                // Left: Expected Output
                const expBox = createIoBox("Expected Output", c.expected !== undefined ? c.expected : "");
                body.appendChild(expBox);

                // Right: Output
                let outText = "";
                if (isRuntimeErr && c.error) {
                    outText = c.error;
                } else if (isTimeout) {
                    outText = c.actual || "(stopped after 2s, possible infinite loop)";
                } else {
                    outText = c.actual !== undefined ? c.actual : "";
                    if (c.error) {
                        outText += (outText ? "\n" : "") + c.error;
                    }
                }
                const actBox = createIoBox("Output", outText);
                body.appendChild(actBox);

                card.appendChild(body);
                listContainer.appendChild(card);
            });

            resultsBody.appendChild(listContainer);
        }

        // Initialize
        loadProblems();
    </script>
</body>
